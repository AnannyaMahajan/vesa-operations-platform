version: '3.8'

services:
  vesa-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vesa-operations-platform
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=vesa_enterprise_production_jwt_secret_key_2026!
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - vesa-data:/app/backend/data
      - vesa-uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  vesa-data:
  vesa-uploads:
